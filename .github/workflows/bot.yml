name: 24_7Jeff

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Minecraft Console Client
      run: |
        curl -fsSL https://mccteam.github.io/install.sh | bash

    - name: Launch Free Macro Bot
      run: |
        # Turn off the Microsoft login screen natively through system settings
        export MCC_ACCOUNT_TYPE=offline
        
        ./MinecraftClient "Potatos-andFries.Eagler.Host" "1.12.2" "MacroBot247" "tasks.txt"
