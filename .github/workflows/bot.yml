name: 24/7-Eaglercraft-Macro-Player

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Mineflayer and AI Pathfinder
      run: npm install mineflayer mineflayer-pathfinder

    - name: Launch Free Macro Bot
      run: node bot.js
