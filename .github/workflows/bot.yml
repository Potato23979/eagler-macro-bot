name: 24-7-Eaglercraft-AFK-Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # This officially keeps the job running for up to 5 hours max before rotating cleanly
    timeout-minutes: 330 
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install All Required Network Modules
      run: npm install mineflayer ws axios

    - name: Launch Free AFK Bot
      # Removed the timeout syntax loop that was causing the accidental success flag
      run: node bot.js
