name: 24/7 Eaglercraft Macro Player

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Minecraft Console Client
      run: |
        # Pulls the exact linux application binary straight from the core distribution folder
        curl -L -o MinecraftClient https://github.com/MCCTeam/Minecraft-Console-Client/releases/download/1.21.0/MinecraftClient-1.21.0-linux-x64
        chmod +x MinecraftClient

    - name: Launch Free Macro Bot
      run: |
        ./MinecraftClient "Potatos-andFries.Eagler.Host" "1.12.2" "MacroBot247" "tasks.txt" -o
