name: 24/7 Eaglercraft Macro Player

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download and Install Minecraft Console Client
      run: |
        curl -fsSL https://mccteam.github.io/install.sh|sh

    - name: Launch Free Macro Bot
      run: |
        ./MinecraftClient "Potatos-andFries.Eagler.Host" "1.12.2" "MacroBot247" "tasks.txt" -o
