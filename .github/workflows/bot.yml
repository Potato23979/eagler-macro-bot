name: 24/7 Eaglercraft Macro Player

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Minecraft Console Client
      run: |
        curl -fsSL https://mccteam.github.io/install.sh | bash

    - name: Launch Free Macro Bot
      run: |
        # Use lowercase system environment markers to force standard 1.12.2 protocols
        export mcc_general_mcversion="1.12.2"
        export mcc_general_accounttype="Offline"
        
        ./MinecraftClient "MacroBot247" "-" "Potatos-andFries.Eagler.Host" "tasks.txt"
