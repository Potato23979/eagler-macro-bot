name: 24-7-Eaglercraft-AFK-Player

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # Forces GitHub to check and re-run every 5 minutes if the old instance timed out
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install All Required Network Modules
      # Cleaned up: only downloads the 3 core items required to sit still
      run: npm install mineflayer ws axios

    - name: Launch Free AFK Bot
      # Runs for up to 5 and a half hours, then safely resets before hitting GitHub's crash timer
      run: timeout 330m node bot.js || echo "Restarting workflow loop cleanly."
