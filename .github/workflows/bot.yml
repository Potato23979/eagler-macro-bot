name: 24_7fred

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Minecraft Console Client
      run: |
        curl -fsSL https://mccteam.github.io/install.sh | bash

    - name: Generate and Update Settings
      run: |
        # 1. Run MCC for a split second to auto-generate the official configuration file layout
        ./MinecraftClient "" "" "" "" --help || true
        
        # 2. Forcefully replace the account type and version to fix the connection security
        sed -i 's/account_type = ".*"/account_type = "Offline"/' MinecraftClient.ini
        sed -i 's/mcversion = ".*"/mcversion = "1.12.2"/' MinecraftClient.ini

    - name: Launch Free Macro Bot
      run: |
        ./MinecraftClient "MacroBot247" "-" "Potatos-andFries.Eagler.Host" "tasks.txt"
