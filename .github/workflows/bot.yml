name: 24/7 Eaglercraft Macro Player

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Minecraft Console Client
      run: |
        curl -fsSL https://mccteam.github.io/install.sh | bash

    - name: Generate JSON Config Override
      run: |
        # Creates a modern JSON settings profile layout to skip server autodetect loops completely
        cat << 'EOF' > MinecraftClient.json
        {
          "Main": {
            "mcversion": "1.12.2",
            "account_type": "Offline"
          }
        }
        EOF

    - name: Launch Free Macro Bot
      run: |
        ./MinecraftClient "MacroBot247" "-" "Potatos-andFries.Eagler.Host" "tasks.txt"
