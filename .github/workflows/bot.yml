name: 24_7Jeff

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Minecraft Console Client
      run: |
        curl -fsSL https://mccteam.github.io/install.sh | bash

    - name: Force Version Overrides
      run: |
        # Generates a settings file forcing the tool to skip autodetect and use 1.12.2 protocols
        cat << 'EOF' > MinecraftClient.ini
        [Main]
        mcversion = 1.12.2
        EOF

    - name: Launch Free Macro Bot
      run: |
        ./MinecraftClient "MacroBot247" "-" "Potatos-andFries.Eagler.Host" "tasks.txt"
