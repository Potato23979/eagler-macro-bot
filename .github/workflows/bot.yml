name: 24/7 Eaglercraft Macro Player

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Minecraft Console Client
      run: |
        curl -fsSL https://mccteam.github.io/install.sh | bash

    - name: Launch Free Macro Bot
      run: |
        # Force the version setting down to 1.12.2 by generating an internal configuration file natively
        echo -e "[Main]\nmcversion=1.12.2\naccount_type=Offline" > MinecraftClient.ini
        
        ./MinecraftClient "MacroBot247" "-" "Potatos-andFries.Eagler.Host" "tasks.txt"
