name: 24/7 Eaglercraft Macro Player

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Minecraft Console Client
      run: |
        wget -q -O mcc https://github.com/MCCTeam/Minecraft-Console-Client/releases/latest/download/MinecraftClient-Linux-zip-x64
        chmod +x mcc

    - name: Launch Free Macro Bot
      run: |
        ./mcc "Potatos-andFries.Eagler.Host" "1.12.2" "MacroBot247" "tasks.txt"
