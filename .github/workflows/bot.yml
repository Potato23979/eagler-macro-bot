name: 24/7 Eaglercraft Macro Player

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up .NET Runtime
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Install Minecraft Console Client
      run: |
        dotnet tool install --global MinecraftConsoleClient.Tool || true
        echo "export PATH=$PATH:$HOME/.dotnet/tools" >> $GITHUB_ENV

    - name: Launch Free Macro Bot
      run: |
        export PATH=$PATH:$HOME/.dotnet/tools
        mcc "Potatos-andFries.Eagler.Host" "1.12.2" "MacroBot247" "tasks.txt"
